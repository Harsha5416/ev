name: EV charger monitor
on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (GitHub may delay runs a few minutes)
  workflow_dispatch:          # lets you run it by hand from the Actions tab
permissions:
  contents: write
jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Read charger status
        run: python ev_scrape.py
      - name: Save debug screenshots if a count was missing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug_*.png
          if-no-files-found: ignore
      - name: Commit the log
        run: |
          git config user.name "ev-monitor"
          git config user.email "ev-monitor@users.noreply.github.com"
          git add ev_log.csv
          git commit -m "log $(date -u +%FT%TZ)" || exit 0
          git push
